<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <nav class="top-nav" id="top-nav" aria-label="Main"></nav>
    <main class="profile-main">
      <div id="alert" class="alert error" hidden></div>
      <div id="root"></div>
      <section class="card profile-section" id="msg-section" hidden>
        <h2>Team discussion</h2>
        <div id="messages" class="msg-thread"></div>
        <form id="msg-form" class="form-stack">
          <div class="field">
            <label for="msg_body">Message</label>
            <textarea id="msg_body" rows="3" required></textarea>
          </div>
          <button type="submit" class="btn">Send</button>
        </form>
      </section>
    </main>
    <script src="/js/project.js" type="module"></script>
  </body>
</html>
