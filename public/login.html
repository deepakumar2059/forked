<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Log in — Student Collaboration</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <nav class="top-nav" id="top-nav" aria-label="Main"></nav>
    <header class="site-header">
      <h1>Log in</h1>
      <p class="tagline">Use the email and password you registered with.</p>
    </header>
    <main class="auth-page">
      <section class="card">
        <div id="alert" class="alert error" hidden></div>
        <form id="form">
          <div class="form-stack">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="password">Password</label>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                required
              />
            </div>
          </div>
          <button type="submit" class="btn">Log in</button>
        </form>
        <p style="margin-top: 1.25rem; margin-bottom: 0; color: var(--muted); font-size: 0.9rem">
          No account?
          <a href="/register.html">Register</a>
        </p>
      </section>
    </main>
    <script src="/js/login.js" type="module"></script>
  </body>
</html>
